
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>DMMMSU Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- University Header -->
    <header>
        <img src="dmmmsulogo.png" alt="DMMMSU Logo">
        <h2>Don Mariano Marcos Memorial State University</h2>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <a href="index.html">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Register</a>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="container">

            <!-- Login Form -->
            <div class="login-box">
                <h3>Login Form</h3>

                <form action="#" method="post">
                    <label for="username">Username:</label>
                    <input type="text"
                           id="username"
                           name="username"
                           required>

                    <label for="password">Password:</label>
                    <input type="password"
                           id="password"
                           name="password"
                           required>

                    <button type="submit">Login</button>
                </form>
            </div>

            <!-- Campus Image -->
            <div class="image-box">
                <img src="bird.png"
                     alt="DMMMSU Campus">
            </div>

        </div>
    </main>

</body>
</html>
